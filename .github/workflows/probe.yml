name: TradeAlpha one-time probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [probe.js]
permissions:
  contents: read
concurrency:
  group: tradealpha-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TA_USERNAME: ${{ secrets.TA_USERNAME }}
      TA_PASSWORD: ${{ secrets.TA_PASSWORD }}
    steps:
      - name: Require private repository before accessing account
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo 'Set repository visibility to Private before running this workflow.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: One-time network and PDF probe
        run: npm run probe
      - name: Keep private diagnostic result
        if: ${{ always() && github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: tradealpha-probe
          path: diagnostic/
          retention-days: 1
          if-no-files-found: warn
